name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar SDK de Android preinstalado
        run: |
          echo "El runner de GitHub ya trae el SDK de Android."
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          echo "local.properties ->"; cat local.properties

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar wrapper (si falta)
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK debug
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: "1.0.${{ github.run_number }}"
        run: gradle testDebugUnitTest assembleDebug --stacktrace

      - name: Preparar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NetScan.apk

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NetScan-debug
          path: NetScan.apk
          if-no-files-found: error

      - name: Publicar Release (para auto-actualización)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "NetScan 1.0.${{ github.run_number }}"
          body: "Compilación automática #${{ github.run_number }}."
          files: NetScan.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
