name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Usar SDK de Android preinstalado
        run: |
          echo "El runner de GitHub ya trae el SDK de Android."
          echo "sdk.dir=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" > local.properties
          echo "local.properties ->"; cat local.properties

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generar wrapper (si falta)
        run: gradle wrapper --gradle-version 8.9

      - name: Compilar APK debug
        run: gradle assembleDebug --stacktrace

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: NetScan-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
